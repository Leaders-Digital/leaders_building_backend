name: Build and Deploy Backend

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-building-old:latest
      
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Create backend directory if it doesn't exist
            mkdir -p /home/ubuntu/backend-building
            mkdir -p /home/ubuntu/backend-building/uploads
            
            # Set DockerHub username
            DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            
            # Create docker-compose.yml for backend
            cat > /home/ubuntu/backend-building/docker-compose.yml << EOF
            version: '3.8'
            
            services:
              backend-building:
                image: ${DOCKERHUB_USER}/backend-building-old:latest
                container_name: backend-building-app
                ports:
                  - "8000:8002"
                env_file:
                  - .env
                volumes:
                  - ./uploads:/app/uploads
                user: "1001:1001"
                restart: unless-stopped
                networks:
                  - backend-network
            
            networks:
              backend-network:
                driver: bridge
            EOF
            
            # Create .env file if it doesn't exist (or update it)
            if [ ! -f /home/ubuntu/backend-building/.env ]; then
              cat > /home/ubuntu/backend-building/.env << 'ENVEOF'
            NODE_ENV=production
            PORT=8000
            EMAIL_USER=leaders.dev@leaders-building.com
            EMAIL_PASS=SiteWeb@MakeUp@2024
            MONGODB_URI=mongodb+srv://leadersdev1:eeYrZtYTykpEvZoB@cluster0.xpa7e.mongodb.net/leaders-crm
            JWT_SECRET=leadersbusiness@!2021
            JWT_EXPIRES_IN=7d
            API_KEY=lead!ers@bus!iness@!20!24
            ENVEOF
            fi
            
            # Stop any existing backend containers that might conflict
            sudo docker stop backend-building-app 2>/dev/null || true
            sudo docker rm backend-building-app 2>/dev/null || true
            
            # Navigate to backend directory
            cd /home/ubuntu/backend-building
            
            # Pull the latest backend image
            sudo docker compose pull
            
            # Start the backend service
            sudo docker compose up -d
